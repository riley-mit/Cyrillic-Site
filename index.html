<HEAD>
    <!-- Author: Riley M -->
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</HEAD>

<BODY>
    <!-- Setting up my flexboxes! -->
     <!-- Header is the top bar, then we have three columns, then a footer-->
    <div class="container">
        
        <div id="header" style="text-align:left;margin:1em">
            <a href="/settings.html"><img src="/images/settings.png" style="width:5em"></a>
        </div>

        <div id="photos">
            <div id="photo_1"><img></div>
            <div id="photo_1"><img></div>
        </div>

        <div id="middle">
            <h2 id="letter-name"></h2>
            <div class="letter_row">
                <button id="play-btn">&#9654;&#xFE0E; Play</button>
                <div id="typed-letter"></div>
            </div>
        </div>

        <div id="wordbank">
            <div id="total_words">
            <h3>Wordbank</h3>
            <ul id="word-list"></ul>
            </div>
        </div>
        
        <div id="footer">
            <button id="skip-btn">Skip</button>
        </div>

    </div>
</BODY>
